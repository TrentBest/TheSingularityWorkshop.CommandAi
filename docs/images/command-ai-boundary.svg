<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">CommandAi proposal boundary</title>
  <desc id="desc">Untrusted response text passes through the CommandAi codec to a structured proposal. The host then independently resolves meaning, validates, authorizes, requests approval where appropriate, and dispatches any accepted command.</desc>
  <defs><style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.core{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.host{fill:#fef3c7;stroke:#a16207;stroke-width:2}.label{font:600 16px sans-serif;fill:#0f172a}.small{font:13px sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:2.5;fill:none}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>
  <rect x="20" y="75" width="175" height="100" rx="12" class="box"/><text x="107" y="115" text-anchor="middle" class="label">Untrusted</text><text x="107" y="138" text-anchor="middle" class="label">response text</text>
  <path d="M195 125 H235" class="arrow" marker-end="url(#arrow)"/>
  <rect x="240" y="75" width="190" height="100" rx="12" class="core"/><text x="335" y="112" text-anchor="middle" class="label">CommandAi codec</text><text x="335" y="137" text-anchor="middle" class="small">shape + version checks</text>
  <path d="M430 125 H470" class="arrow" marker-end="url(#arrow)"/>
  <rect x="475" y="75" width="180" height="100" rx="12" class="core"/><text x="565" y="112" text-anchor="middle" class="label">CommandProposal</text><text x="565" y="137" text-anchor="middle" class="small">data, not authority</text>
  <path d="M655 125 H695" class="arrow" marker-end="url(#arrow)"/>
  <rect x="700" y="30" width="280" height="190" rx="12" class="host"/><text x="840" y="60" text-anchor="middle" class="label">Host-owned responsibilities</text>
  <text x="720" y="92" class="small">1. Resolve trusted identities</text><text x="720" y="120" class="small">2. Validate domain rules/state</text><text x="720" y="148" class="small">3. Authorize + obtain approval</text><text x="720" y="176" class="small">4. Dispatch accepted actions</text>
  <text x="500" y="270" text-anchor="middle" class="small">Authored conceptual diagram · not a runtime trace or generated UML</text>
  <text x="500" y="298" text-anchor="middle" class="small">A successful parse does not prove the proposal is correct, trusted, or safe.</text>
</svg>