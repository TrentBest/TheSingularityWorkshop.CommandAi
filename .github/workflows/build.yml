name: CommandAi CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified package to NuGet.org (owner authorization required)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify Workshop Markdown branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          moniker = '<!-- The Singularity Workshop moniker -->'
          footer = '<!-- THE SINGULARITY WORKSHOP FOOTER -->'
          footer_asset = 'https://raw.githubusercontent.com/TrentBest/FSM_API/master/Documentation/Branding/TheSingularityWorkshop.png'
          failures = []
          pages = sorted(path for path in Path('.').rglob('*.md')
                         if not any(part in {'.git', 'bin', 'obj'} for part in path.parts))
          for page in pages:
              content = page.read_text(encoding='utf-8')
              if not content.lstrip().startswith(moniker):
                  failures.append(f'{page}: missing animated moniker at top')
              if footer not in content or footer_asset not in content:
                  failures.append(f'{page}: missing canonical Workshop PNG footer')
          if failures:
              print('Workshop Markdown branding check failed:')
              print('\\n'.join(failures))
              sys.exit(1)
          print(f'Validated animated moniker and canonical footer in all {len(pages)} Markdown files.')
          PY
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore TheSingularityWorkshop.CommandAi.slnx
      - name: Build
        run: dotnet build TheSingularityWorkshop.CommandAi.slnx --configuration Release --no-restore
      - name: Test with coverage
        run: dotnet test TheSingularityWorkshop.CommandAi.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.CommandAi
          files: TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: true
          verbose: true
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: command-ai-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
      - name: Run quickstart
        run: dotnet run --project examples/CommandAi.QuickStart/CommandAi.QuickStart.csproj --configuration Release --no-build
      - name: Pack
        run: dotnet pack TheSingularityWorkshop.CommandAi.csproj --configuration Release --no-build --output ./artifacts
      - name: Audit and compile quickstart against packed package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find ./artifacts -maxdepth 1 -type f -name '*.nupkg' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "Expected a CommandAi package artifact."
            exit 1
          fi
          package_version="$(python3 - "$package" <<'PY'
          import sys, zipfile
          from xml.etree import ElementTree as ET
          with zipfile.ZipFile(sys.argv[1]) as package:
              names = package.namelist()
              nuspec_name = next((name for name in names if name.endswith('.nuspec')), None)
              assert nuspec_name, 'Package nuspec is missing'
              assert any(name.lower() == 'readme.md' for name in names), 'Package README is missing'
              assert any(name.endswith('LICENSE.txt') for name in names), 'Package license is missing'
              assert any(name.startswith('lib/net8.0/') and name.endswith('.dll') for name in names), 'Package assembly is missing'
              assert any(name.startswith('lib/net8.0/') and name.endswith('.xml') for name in names), 'Package XML documentation is missing'
              root = ET.fromstring(package.read(nuspec_name))
              metadata = root.find('.//{*}metadata')
              assert metadata is not None, 'Package metadata is missing'
              def value(tag):
                  node = metadata.find('{*}' + tag)
                  return node.text.strip() if node is not None and node.text else ''
              assert value('id') == 'TheSingularityWorkshop.CommandAi', f"Unexpected package ID: {value('id')}"
              assert value('version') == '0.1.0-alpha.2', f"Unexpected package version: {value('version')}"
              assert value('license') or value('licenseUrl'), 'Package license metadata is missing'
              assert value('readme') == 'README.md', f"Unexpected package README metadata: {value('readme')}"
              assert not root.findall('.//{*}dependency'), 'CommandAi core must remain dependency-free'
              print(value('version'))
          PY
          )"
          sample="examples/CommandAi.QuickStart/CommandAi.QuickStart.csproj"
          dotnet restore "$sample" --source "$PWD/artifacts" -p:UsePackedCommandAi=true -p:CommandAiPackageVersion="$package_version"
          dotnet build "$sample" --configuration Release --no-restore -p:UsePackedCommandAi=true -p:CommandAiPackageVersion="$package_version"
          dotnet run --project "$sample" --configuration Release --no-build --no-restore

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: command-ai-nuget-package
          path: ./artifacts/*.nupkg

  publish_nuget:
    needs: build-and-test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && false }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: command-ai-nuget-package
          path: ./artifacts
      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop
      - name: Publish package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
