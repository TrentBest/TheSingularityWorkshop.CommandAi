name: CiAi Commit Evidence

on:
  workflow_run:
    workflows:
      - CommandAi CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact full 40-character CommandAi commit SHA to observe
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ciai-commandai-evidence-${{ github.event.workflow_run.head_sha || inputs.target_sha }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe exact CommandAi CI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve target repository and commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          repository="${EVENT_REPOSITORY:-${GITHUB_REPOSITORY}}"
          sha="${EVENT_SHA:-${INPUT_SHA}}"
          if [[ "$repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Unexpected workflow repository: $repository"
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Target must be an exact full 40-character commit SHA."
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"
          echo "Observing $repository@${sha,,} after event $EVENT_NAME"

      - name: Check out CiAi observer at verified development revision
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: 49a802fcab60fa7411b01892072d7e2c8a2c72a9
          path: .ciai
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore CiAi observer
        working-directory: .ciai
        run: dotnet restore samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj

      - name: Build CiAi observer
        working-directory: .ciai
        run: dotnet build samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj --configuration Release --no-restore

      - name: Observe CommandAi workflow runs, attempts, jobs, and steps
        working-directory: .ciai
        env:
          CIAI_GITHUB_TOKEN: ${{ github.token }}
          CIAI_REQUIRED_WORKFLOW_PATHS: .github/workflows/build.yml
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          dotnet run --project samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release --no-build -- "$TARGET_REPOSITORY" "$TARGET_SHA" ../artifacts/commandai-observation.json

      - name: Upload CiAi evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commandai-ciai-evidence
          path: |
            artifacts/commandai-observation.json
            artifacts/commandai-observation.md
          if-no-files-found: warn
          retention-days: 30
