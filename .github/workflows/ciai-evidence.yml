name: CiAi Exact Commit Evidence

on:
  workflow_run:
    workflows:
      - CommandAi CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_run_id:
        description: Exact completed CommandAi CI run ID to observe
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ciai-commandai-evidence-${{ github.event.workflow_run.id || inputs.target_run_id }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe and gate exact CommandAi CI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Resolve exact CommandAi source run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          INPUT_RUN_ID: ${{ inputs.target_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$EVENT_REPOSITORY" == "$repository" ]]
            run_id="$EVENT_RUN_ID"
            run_attempt="$EVENT_RUN_ATTEMPT"
            sha="$EVENT_SHA"
          else
            if [[ ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::target_run_id must be a positive decimal integer."
              exit 1
            fi
            run="$(gh api "repos/$repository/actions/runs/$INPUT_RUN_ID")"
            [[ "$(jq -r '.repository.full_name' <<< "$run")" == "$repository" ]]
            [[ "$(jq -r '.head_repository.full_name' <<< "$run")" == "$repository" ]]
            [[ "$(jq -r '.path | split("@")[0]' <<< "$run")" == ".github/workflows/build.yml" ]]
            [[ "$(jq -r '.status' <<< "$run")" == "completed" ]]
            run_id="$(jq -r '.id' <<< "$run")"
            run_attempt="$(jq -r '.run_attempt' <<< "$run")"
            sha="$(jq -r '.head_sha' <<< "$run")"
          fi
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]
          {
            echo "repository=$repository"
            echo "sha=${sha,,}"
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $repository@$sha from run $run_id attempt $run_attempt."

      - name: Check out CiAi observer at immutable development revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: c59e3284b95e5ef4d3fc6be55bc97ca84fb7ee3e
          path: .ciai
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore CiAi observer
        working-directory: .ciai
        run: dotnet restore samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj

      - name: Build CiAi observer
        working-directory: .ciai
        run: dotnet build samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj --configuration Release --no-restore

      - name: Observe and validate exact CommandAi workflow run
        working-directory: .ciai
        env:
          CIAI_GITHUB_TOKEN: ${{ github.token }}
          CIAI_REQUIRED_WORKFLOW_PATHS: .github/workflows/build.yml#${{ steps.source.outputs.run_id }}#${{ steps.source.outputs.run_attempt }}
          CIAI_EXPECTED_WORKFLOW_REF: refs/heads/development
          CIAI_EXPECTED_WORKFLOW_EVENT: push
          TARGET_REPOSITORY: ${{ steps.source.outputs.repository }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          dotnet run --project samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release --no-build -- "$TARGET_REPOSITORY" "$TARGET_SHA" ../artifacts/commandai-observation.json
          expected_workflow=".github/workflows/build.yml#$SOURCE_RUN_ID#$SOURCE_RUN_ATTEMPT"
          jq -e --arg repository "$TARGET_REPOSITORY" --arg sha "$TARGET_SHA" --arg expected "$expected_workflow" '
            .schema == "ciai.commit-observation.v2" and
            .repository == $repository and
            (.headSha | ascii_downcase) == ($sha | ascii_downcase) and
            .discoveryComplete == true and
            .exactRunBindingConfigured == true and
            .exactRunBindingValid == true and
            .complete == true and
            (.requiredWorkflowResults | length) == 1 and
            .requiredWorkflowResults[0].WorkflowPath == $expected and
            .requiredWorkflowResults[0].State == "passed" and
            .requiredWorkflowResults[0].EvidenceComplete == true and
            .requiredWorkflowResults[0].Terminal == true and
            .requiredWorkflowResults[0].Successful == true
          ' ../artifacts/commandai-observation.json >/dev/null
          echo "CiAi verified exact CommandAi source run $SOURCE_RUN_ID attempt $SOURCE_RUN_ATTEMPT for $TARGET_SHA."

      - name: Upload CiAi evidence report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: commandai-ciai-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/commandai-observation.json
            artifacts/commandai-observation.md
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize exact-run provenance and gate result
        if: always()
        env:
          REPOSITORY: ${{ steps.source.outputs.repository }}
          SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          OBSERVER_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## CiAi exact CommandAi commit evidence"
            echo
            echo "- Repository: \`$REPOSITORY\`"
            echo "- Source SHA: \`$SHA\`"
            echo "- Source run / attempt: \`$RUN_ID\` / \`$RUN_ATTEMPT\`"
            echo "- CiAi observer gate: **$OBSERVER_STATUS**"
            echo
            echo "Incomplete, ambiguous, unbound, or unsuccessful evidence fails this workflow."
            echo "This is read-only evidence; it does not authorize merge, publication, release, or deployment."
          } >> "$GITHUB_STEP_SUMMARY"
