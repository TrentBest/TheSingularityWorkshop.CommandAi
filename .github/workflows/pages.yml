name: CommandAi Pages

on:
  workflow_run:
    workflows: ["CommandAi CI"]
    types: [completed]
    branches: [development]

permissions:
  contents: read

jobs:
  package-site:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify portal entry point and core boundary statements
        run: |
          test -s docs/site/index.html
          grep -q 'A well-formed response is still only intent' docs/site/index.html
          grep -q 'docs/images/command-ai-boundary.svg' docs/site/index.html
          test -s docs/images/command-ai-boundary.svg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development' }}
    needs: package-site
    permissions:
      pages: write
      id-token: write
    uses: TrentBest/TheSingularityWorkshop.CiAi/.github/workflows/deploy-pages.yml@5083c452b555d7645dd0c8ab01d76008026da436
